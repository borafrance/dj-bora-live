<script>
(()=>{'use strict';const c=document.getElementById('scene'),g=c.getContext('2d'),banner=document.getElementById('banner');let W=0,H=0,D=1,frame=0,likes=0,roses=0,effect=null,confetti=[],floor=[],smoke=[],rays=[],stars=[],dancers=[],vipGuests=[{name:"@VIP",hue:44}],djGuests=[{name:"@INVITADO",hue:190}];const rand=(a,b)=>a+Math.random()*(b-a);const pick=a=>a[Math.floor(Math.random()*a.length)];function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=Math.round(W*D);c.height=Math.round(H*D);g.setTransform(D,0,0,D,0,0);stars=Array.from({length:100},()=>({x:Math.random()*W,y:Math.random()*H*.8,r:rand(.3,1.6)}))}addEventListener('resize',resize);resize();const names=['Léa','Marco','Sophie','Camila','Alex','Mia','Louis','Nina'];function add(name){dancers.push({name:'@'+(name||names[dancers.length%names.length]),x:rand(.1,.9),y:rand(.56,.85),phase:rand(0,7),hue:rand(0,360),jump:0});document.getElementById('people').textContent=dancers.length}names.forEach(add);function text(s,x,y,size,color='#fff',align='center'){g.fillStyle=color;g.textAlign=align;g.font=`900 ${size}px system-ui`;g.fillText(s,x,y)}function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}function glow(x,y,r,color){r=Math.max(0.1,r);let q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,color);q.addColorStop(1,'transparent');g.fillStyle=q;g.fillRect(x-r,y-r,r*2,r*2)}function dancer(d,i){let x=d.x*W,y=d.y*H,sc=Math.max(.65,Math.min(1.2,W/420)),b=Math.sin(frame*.14+d.phase)*5+(d.jump>0?Math.sin(d.jump*.2)*18:0);if(d.jump>0)d.jump--;g.save();g.translate(x,y+b);g.scale(sc,sc);g.strokeStyle='#ffac88';g.lineWidth=6;g.lineCap='round';g.beginPath();g.moveTo(-10,12);g.lineTo(-19+Math.sin(frame*.15+i)*9,29);g.moveTo(10,12);g.lineTo(20-Math.sin(frame*.15+i)*9,29);g.stroke();g.fillStyle=`hsl(${d.hue},90%,54%)`;g.beginPath();g.roundRect(-17,-5,34,35,7);g.fill();g.strokeStyle='#ffae85';g.beginPath();g.moveTo(-10,29);g.lineTo(-12+Math.sin(frame*.1+i)*5,45);g.moveTo(10,29);g.lineTo(12 function platforms(){

 g.fillStyle='#1b153a';g.beginPath();g.roundRect(x-31,y-20,62,52,12);g.fill();g.strokeStyle='#ffb58b';g.lineWidth=8;g.lineCap='round';g.beginPath();g.moveTo(x-23,y-8);g.lineTo(x-35+Math.sin(frame*.12)*7,y+33);g.moveTo(x+23,y-8);g.lineTo(x+32+Math.cos(frame*.12)*7,y+33);g.stroke();

function base(){rect(0,0,W,H,'#090518');let cosmic=effect&&['galaxy','supreme'].includes(effect.type);for(let s of stars){g.fillStyle=cosmic?'#c9e7ff':'#9b6cba';g.globalAlpha=.3+.5*Math.sin(frame*.025+s.x)**2;g.fillRect(s.x,s.y,s.r,s.r)}g.globalAlpha=1;for(let i=0;i<9;i++){let a=Math.sin(frame*.025+i)*.35;g.strokeStyle=`hsla(${(frame*2+i*37)%360},100%,62%,.22)`;g.lineWidth=8;g.beginPath();g.moveTo((i+.5)/9*W,0);g.lineTo(W*.5+Math.sin(a)*W,H*.65);g.stroke()}let top=H*.55;g.fillStyle='#180b32';g.beginPath();g.moveTo(W*.20,top);g.lineTo(W*.80,top);g.lineTo(W,H*.88);g.lineTo(0,H*.88);g.fill();for(let j=0;j<8;j++){let y=top+(H*.88-top)*j/7;g.strokeStyle=`hsla(${(j*40+frame)%360},100%,65%,.7)`;g.lineWidth=2;g.beginPath();g.moveTo(W*(.20-.20*j/7),y);g.lineTo(W*(.80+.20*j/7),y);g.stroke()}for(let j=0;j<=8;j++){g.strokeStyle='#9d49ec80';g.beginPath();g.moveTo(W*(.2+.6*j/8),top);g.lineTo(W*j/8,H*.88);g.stroke()}platforms();dj();dancers.forEach(dancer)}
function shower(n,power=1){for(let i=0;i<n;i++){let x=rand(0,W),y=rand(-H*.5,H*.2);confetti.push({x,y,vx:rand(-2,2)*power,vy:rand(1.8,5)*power,sz:rand(3,8),h:rand(0,360),rot:rand(0,7),spin:rand(-.15,.15)})}}function puff(n){for(let i=0;i<n;i++)smoke.push({x:rand(0,W),y:rand(H*.48,H*.86),r:rand(30,90),vy:rand(.25,1.4),a:rand(.06,.18),h:rand(175,310)})}function trigger(type,user='@DJ_BORA_FAN'){const dur={rose:1800,medium:3300,meteor:6500,hat:9000,invasion:9500,galaxy:11000,supreme:13000,dance:8000};effect={type,start:performance.now(),end:performance.now()+dur[type],user};confetti=[];floor=[];smoke=[];rays=[];const label={rose:'🌹 ¡GRACIAS!',medium:'✨ ¡SUBE LA FIESTA!',meteor:'☄️ ¡IMPACTO CAPIBARA!',hat:'🧢 ¡GORRA LEGENDARIA!',invasion:'🚀 ¡INVASIÓN TOTAL!',galaxy:'🌌 ¡GALAXIA DESATADA!',supreme:'👑 ¡LEYENDA SUPREMA!',dance:'🕺 ¡BATALLA DE BAILE!'};banner.innerHTML=label[type]+'<span>'+user+'</span>';banner.style.opacity='1';shower(type==='rose'?35:type==='medium'?130:type==='meteor'?420:type==='hat'?1100:type==='invasion'?900:1400,type==='rose'?.7:1.1);puff(type==='rose'?0:type==='medium'?8:type==='hat'?115:70);dancers.forEach(d=>d.jump=dur[type]/40);if(type==='dance')shower(480);if(type==='rose')roses++;document.getElementById('roses').textContent=roses}
function special(now){if(!effect)return;let e=effect,age=(now-e.start)/1000,remain=(e.end-now)/1000;if(remain<=0){effect=null;banner.style.opacity='0';return}let major=!['rose','medium'].includes(e.type),cosmic=['galaxy','supreme'].includes(e.type);if(major){g.fillStyle=cosmic?'#19004b66':'#3c07294d';g.fillRect(0,0,W,H);for(let i=0;i<16;i++){g.strokeStyle=`hsla(${(frame*8+i*23)%360},100%,65%,.65)`;g.lineWidth=rand(3,8);g.beginPath();g.moveTo(W*(i+.5)/16,0);g.lineTo(W*.5+Math.sin(frame*.08+i)*W*.8,H*.85);g.stroke()}}if(e.type==='meteor'){let p=Math.min(1,age/1.3),x=W*(-.2+.7*p),y=H*(-.1+.75*p);if(p<1){glow(x,y,100,'#ff761a99');g.strokeStyle='#ffab35';g.lineWidth=25;g.beginPath();g.moveTo(x-W*.3,y-H*.3);g.lineTo(x,y);g.stroke();text('☄️',x,y,70)}else{glow(W*.5,H*.62,Math.min(W,300),'#ff5a1166');text('🦫',W*.5,H*.57,92)}}if(e.type==='hat'||e.type==='dance'){
 let arenaX=W*.5,arenaY=H*.70;

 let spin=frame*.22;g.save();g.rotate(spin);g.fillStyle='#ffda3c';g.fillRect(-20,-8,40,16);g.fillStyle='#ff7fd1';g.beginPath();g.arc(17,0,12,0,7);g.fill();g.restore();
 g.restore();

 for(let q of smoke){q.y-=q.vy;q.r+=.2;g.fillStyle=`hsla(${q.h},60%,80%,${q.a})`;g.beginPath();g.ellipse(q.x,q.y,q.r,q.r*.65,0,0,7);g.fill()}smoke=smoke.slice(-200);for(let p of confetti){p.x+=p.vx+Math.sin(frame*.04+p.rot)*.5;p.y+=p.vy;p.rot+=p.spin;if(p.y>H*.86){if(floor.length<2500)floor.push({x:p.x,y:rand(H*.85,H*.9),sz:p.sz,h:p.h});p.y=H+20}else{g.save();g.translate(p.x,p.y);g.rotate(p.rot);rect(-p.sz/2,-p.sz/2,p.sz,p.sz*.7,`hsl(${p.h},100%,65%)`);g.restore()}}confetti=confetti.filter(p=>p.y<H+10);for(let p of floor)rect(p.x,p.y,p.sz,p.sz*.55,`hsl(${p.h},100%,67%)`);if(major&&age<1.3){g.fillStyle=`rgba(255,255,255,${Math.max(0,.17-age*.12)})`;g.fillRect(0,0,W,H)}}function loop(now){frame++;base();special(now);requestAnimationFrame(loop)}requestAnimationFrame(loop);
